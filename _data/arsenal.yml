# Arsenal page entries. status: accepted = advisory published AND the PoC
# gist is public — render normally. status: embargoed = advisory is
# published (so target/advisory/severity/impact below ARE real, public
# info) but the PoC gist itself is still secret/withheld — render redacted
# (desc blacked out, no poc_url/poc_label, cat output says withheld).
# Do NOT add an embargoed entry for a finding whose ADVISORY isn't public
# yet (unpublished/draft/triage) — that's a different, unsafe case; don't
# tease an unfixed bug. New entries just append here; the page and
# terminal component render straight from this list.
