---
layout: default
---

<article class="page">
  <header class="post-header">
    {% if page.cover_hero %}<div class="post-cover">{% include cover.html post=page cols=48 rows=12 split=page.cover_split %}</div>{% endif %}
    {% if page.kicker %}<p class="no-line">{{ page.kicker }}</p>{% endif %}
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.description %}<p class="post-dek">{{ page.description }}</p>{% endif %}
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
